# Shared path policy. ~/ is the home; <repo>/ is any checkout containing the path.
# A trailing / covers descendants. * matches within one component.

[guarded]
description = "Reads proceed; writes and runs require approval unless a narrower class permits them."

[[guarded.paths]]
path = "~/.claude/"
reason = "an agent home: the enforcement it loads, its settings, its skills, and its instructions"

[[guarded.paths]]
path = "~/.codex/"
reason = "an agent home: the enforcement it loads, its settings, its skills, and its instructions"

[[guarded.paths]]
path = "~/.copilot/"
reason = "an agent home: the enforcement it loads, its settings, its skills, and its instructions"

[[guarded.paths]]
path = "~/.pi/agent/"
reason = "an agent home: the enforcement it loads, its settings, its skills, and its instructions"

[[guarded.paths]]
path = "~/Library/Application Support/Code/User/prompts/global.instructions.md"
reason = "prompt text the editor gives Copilot in every session"

[[guarded.paths]]
path = "~/Library/Application Support/Code/User/prompts/shell.instructions.md"
reason = "prompt text the editor gives Copilot in every session"

[[guarded.paths]]
path = "~/Library/Application Support/Code/User/settings.json"
reason = "the editor settings that hold Copilot's approval, sandbox, and hook configuration"

[[guarded.paths]]
path = "~/.config/Code/User/prompts/global.instructions.md"
reason = "prompt text the editor gives Copilot in every session"

[[guarded.paths]]
path = "~/.config/Code/User/prompts/shell.instructions.md"
reason = "prompt text the editor gives Copilot in every session"

[[guarded.paths]]
path = "~/.config/Code/User/settings.json"
reason = "the editor settings that hold Copilot's approval, sandbox, and hook configuration"

[[guarded.paths]]
path = "<repo>/users/*/home-manager/claude/settings.json"
reason = "the source of a user's Claude Code permissions, hooks, and sandbox"

[[guarded.paths]]
path = "<repo>/users/*/home-manager/claude/settings.darwin.json"
reason = "the source of a user's Claude Code permissions, hooks, and sandbox"

[[guarded.paths]]
path = "<repo>/users/*/home-manager/claude/settings.linux.json"
reason = "the source of a user's Claude Code permissions, hooks, and sandbox"

[[guarded.paths]]
path = "<repo>/users/*/home-manager/claude/settings.user.json"
reason = "the source of a user's Claude Code permissions, hooks, and sandbox"

[[guarded.paths]]
path = "<repo>/modules/home/ai/codex/rules/"
reason = "the source of Codex's command rules"

[[guarded.paths]]
path = "<repo>/users/*/home-manager/codex/hooks.json"
reason = "the source of a user's Codex hook registration"

[[guarded.paths]]
path = "<repo>/users/*/home-manager/codex/config.toml"
reason = "the source of a user's Codex approval, sandbox, and reviewer policy"

[[guarded.paths]]
path = "<repo>/users/*/home-manager/codex/config.darwin.toml"
reason = "the source of a user's Codex approval, sandbox, and reviewer policy"

[[guarded.paths]]
path = "<repo>/users/*/home-manager/codex/config.linux.toml"
reason = "the source of a user's Codex approval, sandbox, and reviewer policy"

[[guarded.paths]]
path = "<repo>/modules/home/ai/copilot/hooks/"
reason = "the source of the Copilot hook adapter"

[[guarded.paths]]
path = "<repo>/modules/home/ai/pi/security/"
reason = "the source of Pi's hook registration and dispatcher"

[[guarded.paths]]
path = "<repo>/modules/home/ai/pi/extensions/hooks/"
reason = "the source of Pi's hook runner"

[[guarded.paths]]
path = "<repo>/users/*/home-manager/pi/"
reason = "the source of a user's Pi settings and sandbox"

[[guarded.paths]]
path = "<repo>/modules/home/apps/vscode/settings.json"
reason = "the source of the editor settings that hold Copilot's approval, sandbox, and hook configuration"

[[guarded.paths]]
path = "<repo>/users/*/home-manager/vscode/settings.json"
reason = "the source of the editor settings that hold Copilot's approval, sandbox, and hook configuration"

[[guarded.paths]]
path = "<repo>/modules/home/ai/claude/hooks/"
reason = "the source of the hooks only Claude Code runs"

[[guarded.paths]]
path = "<repo>/modules/home/ai/codex/hooks/"
reason = "the source of the hooks only Codex runs"

[[guarded.paths]]
path = "<repo>/modules/home/ai/shared/hooks/"
reason = "the source of the shared hooks, this manifest, and the tool vocabulary"

[[guarded.paths]]
path = "<repo>/modules/home/ai/copilot/instructions/"
reason = "the source of Copilot's instructions"

[[guarded.paths]]
path = "~/.codex/*.config.toml"
reason = "a Codex profile layer, which can widen what the base configuration narrows"

[block]
description = "Block reads, writes, and runs without an approval prompt."

[[block.paths]]
path = "~/.claude.json"
reason = "Claude Code's state file, which holds account state and OAuth material"

[[block.paths]]
path = "~/.claude/.credentials.json"
reason = "Claude Code's stored credentials"

[[block.paths]]
path = "~/.codex/auth.json"
reason = "Codex's stored credentials"

[[block.paths]]
path = "~/.pi/agent/auth.json"
reason = "Pi's stored credentials"

[[block.paths]]
path = "~/.config/mcp-secrets.env"
reason = "the API keys the MCP servers start with"

[exec-through]
description = "Permit existing script runs; other operations retain the guarded default."

[[exec-through.paths]]
path = "~/.claude/skills/"
reason = "a skills root; a skill's own helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.codex/skills/"
reason = "a skills root; a skill's own helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.pi/agent/skills/"
reason = "a skills root; a skill's own helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.agents/skills/"
reason = "the target of the per-agent skills links, which a declaration does not follow"

[write-through]
description = "Permit writes; runs retain the guarded default."

[[write-through.paths]]
path = "~/.claude/projects/"
reason = "Claude Code's memory, which changes no enforcement"

[[exceptions]]
surface = "sensitive-path-name-heuristic"
pattern = "<repo>/scripts/mcp-secrets.sh"
reason = "a tracked program named for the secret file it renders, holding none itself"

# A placeholder pattern is a file name, matched in any directory and excusing reads only.
[[exceptions]]
surface = "sensitive-path-dotenv-placeholder"
pattern = ".env.example"
reason = "a committed list of a project's environment variables with placeholder values"

[[exceptions]]
surface = "sensitive-path-dotenv-placeholder"
pattern = ".env.sample"
reason = "a committed list of a project's environment variables with placeholder values"

[[exceptions]]
surface = "sensitive-path-dotenv-placeholder"
pattern = ".env.template"
reason = "a committed list of a project's environment variables with placeholder values"

[[exceptions]]
surface = "sensitive-path-dotenv-placeholder"
pattern = ".env.op"
reason = "a committed list of a project's environment variables whose values are 1Password secret references"

[[exceptions]]
surface = "capability-coverage"
pattern = "copilot:refuse-unlisted-tools.py"
reason = "the Copilot adapter refuses a tool the vocabulary does not list before any hook runs"

[[exceptions]]
surface = "capability-coverage"
pattern = "pi:refuse-unlisted-tools.py"
reason = "Pi's dispatcher refuses a tool the vocabulary does not list before any hook runs"
