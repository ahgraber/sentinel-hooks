[[enforcement-floor.paths]]
path = "<project>/*.code-workspace"
reason = "a project's own editor workspace, whose settings override the user's"

[[enforcement-floor.paths]]
path = "<project>/.pi/settings.json"
reason = "a project's own Pi settings, which name the extensions Pi loads there"

[[enforcement-floor.paths]]
path = "<project>/.pi/sandbox.json"
reason = "a project's own Pi sandbox configuration, which can turn the sandbox off"

[block]
description = "Block reads, writes, and runs without an approval prompt."

[[block.paths]]
path = "~/.claude.json"
reason = "Claude Code's state file, which holds account state and OAuth material"

[[block.paths]]
path = "~/.claude/.credentials.json"
reason = "Claude Code's stored credentials"

[[block.paths]]
path = "~/.codex/auth.json"
reason = "Codex's stored credentials"

[[block.paths]]
path = "~/.pi/agent/auth.json"
reason = "Pi's stored credentials"

[[block.paths]]
path = "~/.config/mcp-secrets.env"
reason = "the API keys the MCP servers start with"

[[block.paths]]
path = "~/Library/Application Support/Code/User/mcp.json"
reason = "VS Code's MCP server list, which holds the servers' API keys in plain text"

[[block.paths]]
path = "~/.config/Code/User/mcp.json"
reason = "VS Code's MCP server list, which holds the servers' API keys in plain text"

[exec-through]
description = "Permit existing script runs; other operations retain the guarded default."

[[exec-through.paths]]
path = "~/.claude/skills/"
reason = "a skills root; a skill's own helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.codex/skills/"
reason = "a skills root; a skill's own helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.pi/agent/skills/"
reason = "a skills root; a skill's own helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.agents/skills/"
reason = "the target of the per-agent skills links, which a declaration does not follow"

[[exec-through.paths]]
path = "<repo>/modules/home/ai/shared/skills/"
reason = "the skills this repository links into its own checkout"

[write-through]
description = "Permit writes; runs retain the guarded default."

[[write-through.paths]]
path = "~/.claude/projects/"
reason = "Claude Code's memory, which changes no enforcement"

[[exceptions]]
surface = "sensitive-path-name-heuristic"
pattern = "<repo>/scripts/mcp-secrets.sh"
reason = "a tracked program named for the secret file it renders, holding none itself"

# A placeholder pattern is a file name, matched in any directory and excusing reads only.
[[exceptions]]
surface = "sensitive-path-dotenv-placeholder"
pattern = ".env.example"
reason = "a committed list of a project's environment variables with placeholder values"

[[exceptions]]
surface = "sensitive-path-dotenv-placeholder"
pattern = ".env.sample"
reason = "a committed list of a project's environment variables with placeholder values"

[[exceptions]]
surface = "sensitive-path-dotenv-placeholder"
pattern = ".env.template"
reason = "a committed list of a project's environment variables with placeholder values"

[[exceptions]]
surface = "sensitive-path-dotenv-placeholder"
pattern = ".env.op"
reason = "a committed list of a project's environment variables whose values are 1Password secret references"

[[exceptions]]
surface = "capability-coverage"
pattern = "copilot:refuse-unlisted-tools.py"
reason = "the Copilot adapter refuses a tool the vocabulary does not list before any hook runs"

[[exceptions]]
surface = "capability-coverage"
pattern = "pi:refuse-unlisted-tools.py"
reason = "Pi's dispatcher refuses a tool the vocabulary does not list before any hook runs"
