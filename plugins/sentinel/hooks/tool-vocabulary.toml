# Canonical tool names and each harness's spelling of them.

[groups]
mutating = ["Bash", "Write", "Edit", "apply_patch"]
sensitive-path = ["Bash", "Read", "Write", "Edit", "apply_patch"]
destructive-ops = ["Bash"]
shell = ["Bash"]
# Tools judged by the file path their input names.
file = ["Read", "Write", "Edit"]

[ask]
copilot = ["Bash", "Write", "Edit", "apply_patch"]

[mappings.claude]
Bash = "Bash"
Read = "Read"
Write = "Write"
Edit = "Edit"

[mappings.codex]
Bash = "Bash"
Read = "Read"
Write = "Write"
Edit = "Edit"
apply_patch = "apply_patch"

# Read from VS Code 1.139.1 with the Copilot extension 0.67.0.
[mappings.copilot]
Bash = "Bash"
runInTerminal = "Bash"
run_in_terminal = "Bash"
terminal = "Bash"
Read = "Read"
readFile = "Read"
read_file = "Read"
Write = "Write"
create_file = "Write"
createFile = "Write"
Edit = "Edit"
editFiles = "Edit"
replace_string_in_file = "Edit"
insert_edit_into_file = "Edit"
delete_file = "Edit"
rename_file = "Edit"
apply_patch = "apply_patch"
multi_replace_string_in_file = "Edit"
edit_notebook_file = "Edit"
create_directory = "Write"
# The text is typed into a running terminal, so it is judged as a command.
send_to_terminal = "Bash"

# Read from Pi 0.86.1.
[mappings.pi]
bash = "Bash"
read = "Read"
write = "Write"
edit = "Edit"
# Reads file contents, and nothing else in Pi refuses a credential path to it.
# The dispatcher turns its `path` into the `file_path` a Read is judged by.
grep = "Read"

# Tools each harness emits that no hook checks. A name in neither a mapping nor
# this table is refused: by the adapter for Copilot and Pi, and by
# `refuse-unlisted-tools.py` for Claude Code and Codex, which have no adapter. A
# `tool` may be an `fnmatch` pattern, which also admits every later tool it matches.
# Claude Code's hooks receive its own spellings, so a Claude tool the hooks cannot
# judge as it is stays here or is refused.
# Codex runs `write_stdin` and code-mode `exec` without firing PreToolUse, so no
# entry reaches them.

