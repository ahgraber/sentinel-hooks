# Shared path policy. ~/ is the home; <repo>/ is any checkout containing the path;
# <project>/ is the working directory or any directory above it, and only the
# enforcement floor uses it. A trailing / covers descendants. * matches within one component.

[guarded]
description = "Reads proceed; writes and runs require approval unless a narrower class permits them."

[[guarded.paths]]
path = "~/.claude/"
reason = "an agent home: the enforcement it loads, its settings, its skills, and its instructions"

[[guarded.paths]]
path = "~/.codex/"
reason = "an agent home: the enforcement it loads, its settings, its skills, and its instructions"

[[guarded.paths]]
path = "~/.copilot/"
reason = "an agent home: the enforcement it loads, its settings, its skills, and its instructions"

[[guarded.paths]]
path = "~/.pi/agent/"
reason = "an agent home: the enforcement it loads, its settings, its skills, and its instructions"

[[guarded.paths]]
path = "~/Library/Application Support/Code/User/prompts/global.instructions.md"
reason = "prompt text the editor gives Copilot in every session"

[[guarded.paths]]
path = "~/Library/Application Support/Code/User/prompts/shell.instructions.md"
reason = "prompt text the editor gives Copilot in every session"

[[guarded.paths]]
path = "~/.config/Code/User/prompts/global.instructions.md"
reason = "prompt text the editor gives Copilot in every session"

[[guarded.paths]]
path = "~/.config/Code/User/prompts/shell.instructions.md"
reason = "prompt text the editor gives Copilot in every session"

[enforcement-floor]
description = "Reads proceed; writes and runs require approval, and no exec-through or write-through declaration permits them."

[[enforcement-floor.paths]]
path = "~/.claude/hooks/"
reason = "the hooks Claude Code runs"

[[enforcement-floor.paths]]
path = "~/.codex/hooks/"
reason = "the hooks Codex runs"

[[enforcement-floor.paths]]
path = "~/.copilot/hooks/"
reason = "the hooks Copilot runs"

[[enforcement-floor.paths]]
path = "~/.pi/agent/extensions/hooks/"
reason = "Pi's hook runner"

[[enforcement-floor.paths]]
path = "~/.agents/hooks/"
reason = "hook files the editor loads in every workspace"

[[enforcement-floor.paths]]
path = "~/.claude/plugins/"
reason = "Claude Code's installed plugins, whose hooks it runs"
plugins = true

[[enforcement-floor.paths]]
path = "~/.codex/plugins/"
reason = "Codex's installed plugins, whose hooks it runs"
plugins = true

[[enforcement-floor.paths]]
path = "~/.copilot/installed-plugins/"
reason = "Copilot CLI's installed plugins, whose hooks it runs"
plugins = true

[[enforcement-floor.paths]]
path = "~/.vscode/agent-plugins/"
reason = "editor agent plugins, whose hooks the editor loads whatever its hook locations say"
plugins = true

[[enforcement-floor.paths]]
path = "~/.pi/agent/git/"
reason = "Pi packages installed from git, whose extensions Pi loads"
plugins = true

[[enforcement-floor.paths]]
path = "~/.pi/agent/npm/"
reason = "Pi packages installed from npm, whose extensions Pi loads"
plugins = true

[[enforcement-floor.paths]]
path = "~/.claude/settings*.json"
reason = "Claude Code's permissions, hooks, and sandbox"

[[enforcement-floor.paths]]
path = "~/.codex/config.toml"
reason = "Codex's approval, sandbox, and reviewer policy"

[[enforcement-floor.paths]]
path = "~/.codex/*.config.toml"
reason = "a Codex profile layer, which can widen what the base configuration narrows"

[[enforcement-floor.paths]]
path = "~/.codex/hooks.json"
reason = "Codex's hook registration"

[[enforcement-floor.paths]]
path = "~/.codex/rules/"
reason = "Codex's command rules"

[[enforcement-floor.paths]]
path = "~/.copilot/settings.json"
reason = "Copilot CLI's settings, which can turn off its plugins and hooks"

[[enforcement-floor.paths]]
path = "~/.copilot/config.json"
reason = "Copilot CLI's record of its installed plugins, which can turn one off"

[[enforcement-floor.paths]]
path = "~/.pi/agent/settings.json"
reason = "Pi's settings, which name the extensions it loads"

[[enforcement-floor.paths]]
path = "~/.pi/agent/hooks.json"
reason = "Pi's hook registration"

[[enforcement-floor.paths]]
path = "~/Library/Application Support/Code/User/settings.json"
reason = "the editor settings that hold Copilot's approval, sandbox, and hook configuration"

[[enforcement-floor.paths]]
path = "~/.config/Code/User/settings.json"
reason = "the editor settings that hold Copilot's approval, sandbox, and hook configuration"

[[enforcement-floor.paths]]
path = "<repo>/.claude/settings*.json"
reason = "a project's own Claude Code settings, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<repo>/.codex/config.toml"
reason = "a project's own Codex configuration, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<repo>/.codex/*.config.toml"
reason = "a project's own Codex profile layers, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<repo>/.codex/hooks.json"
reason = "a project's own Codex hook registration, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<repo>/.codex/rules/"
reason = "a project's own Codex command rules, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<repo>/.vscode/settings.json"
reason = "a project's own editor settings, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<project>/.claude/settings*.json"
reason = "a project's own Claude Code settings, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<project>/.codex/config.toml"
reason = "a project's own Codex configuration, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<project>/.codex/*.config.toml"
reason = "a project's own Codex profile layers, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<project>/.codex/hooks.json"
reason = "a project's own Codex hook registration, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<project>/.codex/rules/"
reason = "a project's own Codex command rules, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<project>/.vscode/settings.json"
reason = "a project's own editor settings, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<project>/.github/hooks/"
reason = "a project's own editor hook files, which every agent working there loads"

[[enforcement-floor.paths]]
path = "<project>/.github/copilot/settings*.json"
reason = "a project's own Copilot CLI settings, which can turn off its plugins and hooks"

[[enforcement-floor.paths]]
path = "<project>/*.code-workspace"
reason = "a project's own editor workspace, whose settings override the user's"

[[enforcement-floor.paths]]
path = "<project>/.pi/settings.json"
reason = "a project's own Pi settings, which name the extensions Pi loads there"

[[enforcement-floor.paths]]
path = "<project>/.pi/sandbox.json"
reason = "a project's own Pi sandbox configuration, which can turn the sandbox off"

[block]
description = "Block reads, writes, and runs without an approval prompt."

[[block.paths]]
path = "~/.claude.json"
reason = "Claude Code's state file, which holds account state and OAuth material"

[[block.paths]]
path = "~/.claude/.credentials.json"
reason = "Claude Code's stored credentials"

[[block.paths]]
path = "~/.codex/auth.json"
reason = "Codex's stored credentials"

[[block.paths]]
path = "~/.pi/agent/auth.json"
reason = "Pi's stored credentials"

[[block.paths]]
path = "~/.config/mcp-secrets.env"
reason = "the API keys the MCP servers start with"

[[block.paths]]
path = "~/Library/Application Support/Code/User/mcp.json"
reason = "VS Code's MCP server list, which holds the servers' API keys in plain text"

[[block.paths]]
path = "~/.config/Code/User/mcp.json"
reason = "VS Code's MCP server list, which holds the servers' API keys in plain text"

[exec-through]
description = "Permit existing script runs; other operations retain the guarded default."

[[exec-through.paths]]
path = "~/.claude/skills/"
reason = "a skills root; a skill's own helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.codex/skills/"
reason = "a skills root; a skill's own helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.pi/agent/skills/"
reason = "a skills root; a skill's own helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.agents/skills/"
reason = "the target of the per-agent skills links, which a declaration does not follow"

[[exec-through.paths]]
path = "~/.claude/plugins/cache/*/*/*/skills/"
reason = "an installed plugin's skills; its helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.codex/plugins/cache/*/*/*/skills/"
reason = "an installed plugin's skills; its helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.copilot/installed-plugins/*/*/skills/"
reason = "an installed plugin's skills; its helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.vscode/agent-plugins/*/*/*/skills/"
reason = "an installed plugin's skills; its helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.vscode/agent-plugins/*/*/*/plugins/*/skills/"
reason = "an installed plugin's skills; its helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.pi/agent/git/*/*/*/skills/"
reason = "an installed plugin's skills; its helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.pi/agent/npm/node_modules/*/skills/"
reason = "an installed plugin's skills; its helper scripts run without a prompt"

[[exec-through.paths]]
path = "~/.pi/agent/npm/node_modules/@*/*/skills/"
reason = "an installed plugin's skills; its helper scripts run without a prompt"

[write-through]
description = "Permit writes; runs retain the guarded default."

[[write-through.paths]]
path = "~/.claude/projects/"
reason = "Claude Code's memory, which changes no enforcement"

[[exceptions]]
surface = "sensitive-path-dotenv-placeholder"
pattern = ".env.example"
reason = "a committed list of a project's environment variables with placeholder values"

[[exceptions]]
surface = "sensitive-path-dotenv-placeholder"
pattern = ".env.sample"
reason = "a committed list of a project's environment variables with placeholder values"

[[exceptions]]
surface = "sensitive-path-dotenv-placeholder"
pattern = ".env.template"
reason = "a committed list of a project's environment variables with placeholder values"

[[exceptions]]
surface = "sensitive-path-dotenv-placeholder"
pattern = ".env.op"
reason = "a committed list of a project's environment variables whose values are 1Password secret references"

[[exceptions]]
surface = "capability-coverage"
pattern = "copilot:refuse-unlisted-tools.py"
reason = "the Copilot adapter refuses a tool the vocabulary does not list before any hook runs"

[[exceptions]]
surface = "capability-coverage"
pattern = "pi:refuse-unlisted-tools.py"
reason = "Pi's dispatcher refuses a tool the vocabulary does not list before any hook runs"
